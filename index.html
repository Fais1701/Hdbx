<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: Arial, sans-serif;
            background: pink;
        }

        #two {
            display: none;
        }

        #two:target {
            display: flex;
        }

        #one:has(~ #two:target) {
            display: none;
        }

        .page {
            width: 100%;
            height: 100vh;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        a {
            display: inline-block;
            margin-top: 30px;
            padding: 16px 30px;
            background: #cc3970;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div id="one" class="page">

    <h1>Rita</h1>

    <p>is officially 23 today ♡</p>

    <a href="#two">
        OPEN YOUR SURPRISE
    </a>

</div>


<div id="two" class="page">

    <h1>IT WORKED!</h1>

    <p>You successfully reached the second screen.</p>

    <a href="#one">
        GO BACK
    </a>

</div>

</body>
</html>
